<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tsinjo - Dons et Aides</title>
    <meta charset="UTF-8"/>
</head>
<body>
<h1>Faire un don</h1>
<form th:action="@{/donations}" method="post">
    <label for="email">Email :</label>
    <input type="email" id="email" name="payerEmail" required/><br/>

    <label for="paymentMethod">Moyen de paiement :</label>
    <input type="text" id="paymentMethod" name="meansOfPayment" required/><br/>

    <label for="paymentRef">Référence de paiement :</label>
    <input type="text" id="paymentRef" name="paymentReference" required/><br/>

    <button type="submit">Donner</button>
</form>

<h2>Dons</h2>
<ul>
    <li th:each="donation : ${donations}">
        <span th:text="${donation.payerEmail}">email</span> -
        <span th:text="${donation.meansOfPayment}">moyen</span> -
        <span th:text="${donation.paymentReference}">référence</span> -
        <span th:text="${#dates.format(donation.paymentDate, 'dd/MM/yyyy HH:mm')}">date</span>
    </li>
</ul>

<h2>Aides</h2>
<ul>
    <li th:each="help : ${helps}">
        <span th:text="${help.beneficiary.fullName}">bénéficiaire</span> -
        <span th:text="${help.description}">description</span> -
        <span th:text="${#dates.format(help.helpDate, 'dd/MM/yyyy HH:mm')}">date</span>
    </li>
</ul>
</body>
</html>
